name: reportaya
description: "ReportaYA - Flutter port of React Native app (gestion de reportes urbanos)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  get: ^4.6.6

  # Networking
  dio: ^5.7.0

  # Local persistence
  get_storage: ^2.1.1

  # Maps (using WebView + Leaflet, mirrors RN approach)
  webview_flutter: ^4.10.0

  # Geolocation
  geolocator: ^13.0.1

  # Image picker (camera)
  image_picker: ^1.1.2

  # Permissions
  permission_handler: ^11.3.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Misc
  intl: ^0.20.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
